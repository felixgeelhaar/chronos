version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/sqlite/queries.sql"
    schema: "sql/sqlite/migrations/001_initial.sql"
    gen:
      go:
        package: "sqlite"
        out: "internal/store/sqlite"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "TEXT"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
            nullable: false
          - db_type: "REAL"
            go_type: "float64"
            nullable: false
          - db_type: "INTEGER"
            go_type: "int64"
            nullable: false
