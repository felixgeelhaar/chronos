version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      excludes:
        # G404: Math/rand is fine for non-crypto sample generation in
        # detector tests; we don't currently use it in production code.
        - G404

  exclusions:
    # Test files do not need to satisfy gosec's hardening rules; the
    # cost would be more code without security gain.
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck   # cleanup Close()/Serve() in tests is acceptable
          - revive     # unused parameters on interface impls / fakes
          - gocritic   # appendAssign on intentional fan-out
          - staticcheck # S1039 fmt.Sprintf-only-literal in test fixtures
          - unused     # synchronisation helpers reserved for future use
      # Generated sqlc code is owned by the generator; we do not edit it.
      - path: internal/store/sqlite/sqlcgen/.*
        linters:
          - revive
          - staticcheck
          - unused
      # cmd/chronos serve interceptor — `info *grpc.UnaryServerInfo` is
      # part of the gRPC interceptor signature, not optional.
      - path: cmd/chronos/serve\.go
        linters:
          - revive
        text: "unused-parameter"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
