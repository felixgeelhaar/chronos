name: Bug report
description: Something is wrong with chronos. Please share enough to reproduce it.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The faster we can reproduce it, the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I run `chronos compute --adapter=foo --scope-id=...`, it ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal recipe — config values, commands, sample data shape.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: chronos version
      description: Output of `chronos version`
      placeholder: chronos v0.x.y (commit abcdef, built ...)
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Database backend
      options:
        - sqlite
        - postgres
        - memory
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version (only for `go install` users)
      placeholder: go1.23.x

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste with `CHRONOS_VERBOSE=1` set so we see error causes.
      render: text
