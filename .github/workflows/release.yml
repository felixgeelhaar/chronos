name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release and upload artefacts
  packages: write   # push the multi-arch image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history is required for the changelog filter and for
          # `git describe` to compute the version when invoked manually.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up QEMU
        # Required for cross-arch Docker builds (linux/arm64 on a
        # linux/amd64 runner).
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Homebrew tap secret is present
        # Without this PAT, goreleaser would silently skip pushing the
        # formula update to felixgeelhaar/homebrew-tap. Fail loud
        # instead so a misconfigured release is caught before the
        # release artefacts are published.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set."
            echo "Create a PAT with 'contents: write' on felixgeelhaar/homebrew-tap and store it as HOMEBREW_TAP_TOKEN in this repo's Actions secrets."
            exit 1
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # goreleaser's brews block reads {{ .Env.TAP_GITHUB_TOKEN }}
          # for cross-repo formula pushes; GITHUB_TOKEN cannot reach
          # the tap repo.
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
