version: 2

project_name: chronos

before:
  hooks:
    - go mod tidy

builds:
  - id: chronos
    main: ./cmd/chronos
    binary: chronos
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not commonly used and avoids having to
      # publish an extra binary for vanishing demand.
      - goos: windows
        goarch: arm64

archives:
  - id: chronos
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch

release:
  # Was `draft: true`, the only repo in the fleet that drafted. Combined with
  # the brew push below it published a formula pointing at assets that were
  # never made public: `brew install chronos` 404'd on every URL.
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## chronos v{{ .Version }}

    Time / Pattern Perception in the cognitive stack.

nfpms:
  - id: chronos
    package_name: chronos
    vendor: Felix Geelhaar
    homepage: "https://github.com/felixgeelhaar/chronos"
    maintainer: "Felix Geelhaar <felix.geelhaar@gmail.com>"
    description: |-
      Chronos — Time / Pattern Perception in the cognitive stack.
      Ingests time-series observations via adapters and emits structured
      signals (recurrence, trend, spike, drop, stall, anomaly,
      seasonality, correlation) for downstream interpretation.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/chronos/LICENSE
        file_info:
          mode: 0644
      - src: ./README.md
        dst: /usr/share/doc/chronos/README.md
        file_info:
          mode: 0644

homebrew_casks:
  - name: chronos
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      branch: main
      # The workflow's GITHUB_TOKEN cannot push to another repo; the org
      # secret HOMEBREW_TAP_TOKEN holds a klarlabs-owned PAT that can.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/chronos"
    description: "Time / Pattern Perception in the cognitive stack"
    license: "MIT"
    # Skip prereleases so `brew install` always points at a stable build.
    # Note this guards PRERELEASE only, not draft — which is exactly why
    # `draft: true` above used to publish a cask for a release nobody could
    # download.
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): bump chronos to {{ .Tag }}"

dockers:
  - image_templates:
      - "ghcr.io/felixgeelhaar/chronos:{{ .Version }}-amd64"
      - "ghcr.io/felixgeelhaar/chronos:latest-amd64"
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    extra_files:
      - go.mod
      - go.sum
  - image_templates:
      - "ghcr.io/felixgeelhaar/chronos:{{ .Version }}-arm64"
      - "ghcr.io/felixgeelhaar/chronos:latest-arm64"
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    extra_files:
      - go.mod
      - go.sum

docker_manifests:
  - name_template: "ghcr.io/felixgeelhaar/chronos:{{ .Version }}"
    image_templates:
      - "ghcr.io/felixgeelhaar/chronos:{{ .Version }}-amd64"
      - "ghcr.io/felixgeelhaar/chronos:{{ .Version }}-arm64"
  - name_template: "ghcr.io/felixgeelhaar/chronos:latest"
    image_templates:
      - "ghcr.io/felixgeelhaar/chronos:latest-amd64"
      - "ghcr.io/felixgeelhaar/chronos:latest-arm64"
