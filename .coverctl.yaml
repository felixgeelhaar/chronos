# Coverage policy for chronos.
#
# Thresholds track current coverage as a no-regression floor, not an
# aspirational target. Run `coverctl check` to see live numbers and
# `coverctl suggest --strategy current --apply --force` to re-baseline
# after coverage rises. Ratchet upward intentionally rather than
# letting the floor drift.
version: 1
language: go
policy:
  default:
    min: 80
  domains:
    # Well-tested core. Thresholds = current coverage minus a 2pp buffer
    # so flaky tail effects don't fail CI.
    - name: detect
      match:
        - ./internal/detect/...
      min: 88.5
    - name: domain
      match:
        - ./internal/domain/...
      min: 98
    - name: observability
      match:
        - ./internal/observability/...
      min: 78
    - name: pipeline
      match:
        - ./internal/pipeline/...
      min: 80
    - name: similarity
      match:
        - ./internal/similarity/...
      min: 88.9
    # API is partially tested (handlers covered, parse helpers not).
    # Current ~68% with a 3pp buffer.
    - name: api
      match:
        - ./internal/api/...
      min: 65
    # Persistence backends mix tested (memory ~71%, sqlite ~75%, the
    # registry ~70%) with thin untested wrappers (postgres, mysql,
    # libsql remote-mode are gated on integration tests). Aggregate
    # sits in the mid-30s after the multi-backend rollout. Ratchet up
    # as integration tests for postgres and mysql land.
    - name: store
      match:
        - ./internal/store/...
      min: 35
    # CLI: errors.go and version.go are unit-tested. runCompute and
    # runServe are integration paths exercised outside this profile;
    # threshold floors at the current ratio so we don't regress on the
    # tested paths.
    - name: cmd
      match:
        - ./cmd/...
      min: 3
    # Config is fully unit-tested (Default, Validate, every env helper).
    - name: config
      match:
        - ./internal/config/...
      min: 95
    # Ports are pure interface declarations (no executable statements
    # to cover); 0 is the only meaningful threshold.
    - name: ports
      match:
        - ./internal/ports/...
      min: 0

exclude:
  # Generated sqlc code is owned by the generator; coverage on
  # generated code is not actionable.
  - internal/store/sqlite/sqlcgen/...
